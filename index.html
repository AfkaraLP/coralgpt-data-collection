<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --dirt: #866043;
            --dirt-dark: #593D29;
            --stone: #7F7F7F;
            --stone-dark: #4A4A4A;
            --stone-light: #A0A0A0;
            --grass: #5D9B47;
            --grass-dark: #3E6B2F;
            --obsidian: #1D1D21;
            --bedrock: #0C0C0F;
            --gold: #FCDB05;
            --emerald: #17D14F;
            --diamond: #4AEDD9;
            --redstone: #D73131;
            --text: #FFFFFF;
            --text-shadow: #3F3F3F;
            --panel-bg: rgba(0,0,0,0.75);
        }
        @font-face {
            font-family: 'Minecraft';
            src: local('VT323'), local('Courier New');
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'VT323', 'Courier New', monospace;
            background: var(--bedrock);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px);
            color: var(--text);
            display: flex;
            font-size: 18px;
            image-rendering: pixelated;
        }

        .highlight-bot {
            color: var(--diamond);
            background: rgba(74, 237, 217, 0.2);
            padding: 0 4px;
            border: 1px solid var(--diamond);
            text-shadow: 1px 1px 0 #000;
        }

        /* Minecraft Button Style */
        .mc-btn {
            background: linear-gradient(180deg, #7A7A7A 0%, #5A5A5A 50%, #4A4A4A 50%, #3A3A3A 100%);
            border: 3px solid;
            border-color: #FFFFFF #555555 #555555 #FFFFFF;
            color: var(--text);
            padding: 8px 16px;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            text-shadow: 2px 2px 0 var(--text-shadow);
            transition: filter 0.1s;
            width: 100%;
            margin-bottom: 8px;
        }
        .mc-btn:hover {
            background: linear-gradient(180deg, #9A9A9A 0%, #7A7A7A 50%, #6A6A6A 50%, #5A5A5A 100%);
        }
        .mc-btn:active {
            border-color: #555555 #FFFFFF #FFFFFF #555555;
            padding: 9px 15px 7px 17px;
        }
        .mc-btn-green {
            background: linear-gradient(180deg, #5D9B47 0%, #4A8039 50%, #3E6B2F 50%, #2E5B1F 100%);
        }
        .mc-btn-green:hover {
            background: linear-gradient(180deg, #7DBB67 0%, #5D9B47 50%, #4A8039 50%, #3E6B2F 100%);
        }
        .mc-btn-selected {
            background: linear-gradient(180deg, #4AEDD9 0%, #3DBDB2 50%, #2A9D93 50%, #1A7D73 100%);
            border-color: #7FFFFF #1A7D73 #1A7D73 #7FFFFF;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--panel-bg);
            border-right: 4px solid var(--stone-dark);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 4px solid var(--stone-dark);
            background: linear-gradient(180deg, var(--stone-dark) 0%, var(--obsidian) 100%);
        }
        .logo {
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            color: var(--diamond);
        }
        .logo-sub {
            font-size: 14px;
            color: var(--stone-light);
            text-shadow: 1px 1px 0 #000;
            margin-top: 4px;
        }

        /* Controls */
        .controls {
            padding: 16px;
            flex: 1;
        }
        .control-section {
            margin-bottom: 16px;
        }
        .control-label {
            font-size: 16px;
            color: var(--stone-light);
            margin-bottom: 8px;
            text-shadow: 1px 1px 0 #000;
        }

        /* Players Panel */
        .players-panel {
            border-top: 4px solid var(--stone-dark);
            padding: 16px;
            max-height: 250px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 100%);
        }
        .players-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .players-title {
            font-size: 18px;
            color: var(--emerald);
            text-shadow: 2px 2px 0 #000;
        }
        .players-count {
            font-size: 18px;
            color: var(--gold);
            background: rgba(0,0,0,0.5);
            padding: 2px 10px;
            border: 2px solid var(--stone-dark);
        }
        .players-list {
            overflow-y: auto;
            flex: 1;
        }
        .player-item {
            padding: 4px 8px;
            font-size: 16px;
            color: var(--text);
            text-shadow: 1px 1px 0 #000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .player-item:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Main Chat Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 100%),
                repeating-linear-gradient(
                    0deg,
                    var(--obsidian) 0px,
                    var(--obsidian) 32px,
                    #252528 32px,
                    #252528 64px
                );
        }
        .chat-header {
            padding: 16px 24px;
            border-bottom: 4px solid var(--stone-dark);
            background: linear-gradient(180deg, var(--stone-dark) 0%, var(--obsidian) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-title {
            font-size: 24px;
            color: var(--diamond);
            text-shadow: 2px 2px 0 #000;
        }
        .chat-subtitle {
            font-size: 16px;
            color: var(--stone-light);
            text-shadow: 1px 1px 0 #000;
        }

        /* Messages Area */
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .messages-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--stone-light);
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
        }
        .message {
            max-width: 85%;
            padding: 6px 12px;
            background: rgba(0,0,0,0.5);
            border-left: 3px solid var(--stone);
            font-size: 17px;
            text-shadow: 1px 1px 0 #000;
            word-wrap: break-word;
        }
        .message:hover {
            background: rgba(255,255,255,0.1);
        }
        .message-received {
            align-self: flex-start;
        }
        .message-bubble {
            color: var(--text);
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            border-top: 4px solid var(--stone-dark);
            background: linear-gradient(180deg, var(--obsidian) 0%, var(--bedrock) 100%);
        }
        .input-container {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }
        .input-wrapper {
            flex: 1;
            background: #000;
            border: 3px solid;
            border-color: #555555 #FFFFFF #FFFFFF #555555;
            padding: 2px;
        }
        .input-wrapper:focus-within {
            border-color: var(--emerald) var(--grass-dark) var(--grass-dark) var(--emerald);
        }
        .chat-input {
            width: 100%;
            background: #000;
            border: none;
            padding: 10px 12px;
            color: var(--text);
            font-size: 18px;
            font-family: inherit;
            outline: none;
        }
        .chat-input::placeholder {
            color: var(--stone);
        }
        .send-btn {
            padding: 10px 20px;
            background: linear-gradient(180deg, #5D9B47 0%, #4A8039 50%, #3E6B2F 50%, #2E5B1F 100%);
            border: 3px solid;
            border-color: #FFFFFF #555555 #555555 #FFFFFF;
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
            color: var(--text);
            text-shadow: 2px 2px 0 var(--text-shadow);
        }
        .send-btn:hover {
            background: linear-gradient(180deg, #7DBB67 0%, #5D9B47 50%, #4A8039 50%, #3E6B2F 100%);
        }
        .send-btn:active {
            border-color: #555555 #FFFFFF #FFFFFF #555555;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.9);
            border: 3px solid var(--stone);
            padding: 10px 20px;
            font-size: 18px;
            text-shadow: 2px 2px 0 #000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-color: var(--emerald); color: var(--emerald); }
        .toast.error { border-color: var(--redstone); color: var(--redstone); }

        /* Scrollbar - Minecraft style */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--obsidian); border: 2px solid var(--stone-dark); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--stone) 0%, var(--stone-dark) 100%);
            border: 2px solid;
            border-color: var(--stone-light) var(--stone-dark) var(--stone-dark) var(--stone-light);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--stone-light) 0%, var(--stone) 100%);
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="controls">
            <div class="control-section">
                <div class="control-label">Bot Actions</div>
                <button class="mc-btn" onclick="sendJump()">Jump</button>
                <button class="mc-btn" id="sneakBtn" onclick="toggleSneak()">Sneak: OFF</button>
                <button class="mc-btn" onclick="toggleBlocklist()">Blocklist: ON</button>
            </div>
            <div class="control-section">
                <div class="control-label">Agent</div>
                <input type="text" class="chat-input" id="agentPrompt" placeholder="Agent prompt..." style="margin-bottom:8px;width:100%;background:#000;border:2px solid #555;color:var(--text);padding:8px;font-family:inherit;font-size:16px;">
                <button class="mc-btn mc-btn-green" onclick="runAgent()">Run Agent</button>
            </div>
            <div class="control-section">
                <div class="control-label">Hotbar Slot</div>
                <div style="display:flex;gap:2px;">
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(0)">1</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(1)">2</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(2)">3</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(3)">4</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(4)">5</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(5)">6</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(6)">7</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(7)">8</button>
                    <button class="mc-btn slot-btn" style="width:auto;flex:1;padding:6px 0;margin:0;" onclick="selectSlot(8)">9</button>
                </div>
            </div>
        </div>

        <div class="players-panel">
            <div class="players-header">
                <span class="players-title">Online Players</span>
                <span class="players-count" id="playerCount">0</span>
            </div>
            <div class="players-list" id="playersList">
                <div class="player-item" style="color: var(--stone);">Loading...</div>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="chat-header">
            <div>
                <div class="chat-title">Server Chat</div>
                <div class="chat-subtitle">wind.coralmc.it</div>
            </div>
        </header>

        <div class="messages" id="messages">
            <div class="messages-empty">
                <span>Loading chat history...</span>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." autocomplete="off">
                </div>
                <button class="send-btn" onclick="sendChat()">Send</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        let blocklist = [];
        let blocklistEnabled = true;

        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('chatInput');
        const toast = document.getElementById('toast');
        let allMessages = [];
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        const BLOCKLIST_URL = 'all.txt';

        function formatMessage(text) {
            const pattern = /CoralGPTv0d1/g;
            let newText = text.replace(pattern,
                '<span class="highlight-bot">CoralGPTv0d1</span>'
            );

            return newText;
        }

        async function loadBlocklist() {
            try {
                const res = await fetch(
                    `https://raw.githubusercontent.com/AfkaraLP/no-coral-ad/refs/heads/main/${BLOCKLIST_URL}`
                );
                if (!res.ok) throw new Error('HTTP ' + res.status + ' at ' + BLOCKLIST_URL);
        
                const text = await res.text();

                const merged = text
                    .split('\n')
                    .map(l => l.trim())
                    .filter(l => l.length > 0 && !l.startsWith('#'));

                // remove duplicates
                blocklist = [...new Set(merged)];

                console.log('Blocklist loaded:', blocklist.length, 'entries');
            } catch (e) {
                console.error('Failed to load blocklist:', e);
                blocklist = [];
            }
        }

        function isBlocked(message) {
            if (!blocklistEnabled) return false;
            const msgStr = String(message);
            const lower = msgStr.toLowerCase();
            for (const word of blocklist) {
                if (lower.includes(word.toLowerCase())) {
                    return true;
                }
            }
            return false;
        }

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function extractText(data) {
            if (typeof data === 'string') return data;
            if (data && typeof data === 'object') {
                let text = data.text || '';
                if (data.extra && Array.isArray(data.extra)) {
                    for (const part of data.extra) {
                        text += extractText(part);
                    }
                }
                return text;
            }
            return String(data);
        }

        function renderMessages(messages) {
            const filtered = messages.filter(msg => !isBlocked(extractText(msg)));

            if (filtered.length === 0) {
                messagesEl.innerHTML = '<div class="messages-empty"><span>No messages yet</span></div>';
                return;
            }

            const wasAtBottom = messagesEl.scrollHeight - messagesEl.scrollTop <= messagesEl.clientHeight + 50;

            messagesEl.innerHTML = filtered.map(msg =>
                `<div class="message message-received"><div class="message-bubble">${formatMessage(msg)}</div></div>`
            ).join('');

            if (wasAtBottom) {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
        }


        function updatePlayers(players) {
            document.getElementById('playerCount').textContent = players.length;
            const list = document.getElementById('playersList');

            if (players.length === 0) {
                list.innerHTML = '<div class="player-item" style="color: var(--stone);">No players online</div>';
            } else {
                list.innerHTML = players.map(p => `
                    <div class="player-item">${p}</div>
                `).join('');
            }
        }

        function updateSlotUI(slot) {
            document.querySelectorAll('.slot-btn').forEach((btn, i) => {
                btn.classList.toggle('mc-btn-selected', i === slot);
            });
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);
            updateConnectionStatus('connecting');

            ws.onopen = () => {
                reconnectAttempts = 0;
                updateConnectionStatus('connected');
                // Request initial data
                wsSend({ type: 'getMessages' });
                wsSend({ type: 'tab' });
                wsSend({ type: 'getSlot' });
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleServerMessage(msg);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };

            ws.onclose = () => {
                updateConnectionStatus('disconnected');
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = Math.min(500 * reconnectAttempts, 3000);
                    setTimeout(connectWebSocket, delay);
                } else {
                    showToast('Connection lost', 'error');
                }
            };

            ws.onerror = () => {};
        }

        function updateConnectionStatus(status) {
            const subtitle = document.querySelector('.chat-subtitle');
            if (status === 'connected') {
                subtitle.textContent = 'wind.coralmc.it';
                subtitle.style.color = 'var(--emerald)';
            } else if (status === 'connecting') {
                subtitle.textContent = 'Connecting...';
                subtitle.style.color = 'var(--gold)';
            } else {
                subtitle.textContent = 'Reconnecting...';
                subtitle.style.color = 'var(--redstone)';
            }
        }

        function wsSend(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        function handleServerMessage(msg) {
            switch (msg.type) {
                case 'messages':
                    allMessages = msg.data;
                    renderMessages(allMessages);
                    break;
                case 'newMessage':
                    allMessages.push(msg.data);
                    if (allMessages.length > 1000) {
                        allMessages.shift();
                    }
                    renderMessages(allMessages);
                    break;
                case 'players':
                    updatePlayers(msg.data);
                    break;
                case 'slot':
                    updateSlotUI(msg.data);
                    break;
                case 'result':
                    if (!msg.data.success) {
                        showToast(msg.data.message || 'Failed', 'error');
                    }
                    break;
            }
        }

        function sendChat() {
            const msg = inputEl.value.trim();
            if (!msg) return;
            inputEl.value = '';
            wsSend({ type: 'chat', data: msg });
        }

        function sendJump() {
            wsSend({ type: 'jump' });
        }

        let sneaking = false;
        function toggleSneak() {
            sneaking = !sneaking;
            const btn = document.getElementById('sneakBtn');
            btn.textContent = 'Sneak: ' + (sneaking ? 'ON' : 'OFF');
            wsSend({ type: 'sneak', data: sneaking });
        }

        function selectSlot(slot) {
            wsSend({ type: 'slot', data: slot });
        }

        function toggleBlocklist() {
            blocklistEnabled = !blocklistEnabled;
            const btn = event.target;
            btn.textContent = 'Blocklist: ' + (blocklistEnabled ? 'ON' : 'OFF');
            renderMessages(allMessages);
        }

        async function runAgent() {
            const promptEl = document.getElementById('agentPrompt');
            const prompt = promptEl.value.trim();
            
            if (!prompt) {
                showToast('Please enter a prompt', 'error');
                return;
            }

            try {
                const res = await fetch('/agent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const text = await res.text();
                if (res.ok) {
                    showToast(text, 'success');
                    promptEl.value = '';
                } else {
                    showToast(text, 'error');
                }
            } catch (e) {
                showToast('Failed to start agent', 'error');
            }
        }

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });

        // WASD Movement Controls
        const activeKeys = new Set();

        function sendWalk(direction) {
            wsSend({ type: 'walk', data: direction });
        }

        function updateMovement() {
            const w = activeKeys.has('w');
            const a = activeKeys.has('a');
            const s = activeKeys.has('s');
            const d = activeKeys.has('d');

            let direction = 'stop';
            if (w && d) direction = 'forward-left';
            else if (w && a) direction = 'forward-right';
            else if (s && d) direction = 'backward-left';
            else if (s && a) direction = 'backward-right';
            else if (w) direction = 'forward';
            else if (s) direction = 'backward';
            else if (d) direction = 'left';
            else if (a) direction = 'right';

            sendWalk(direction);
        }

        document.addEventListener('keydown', (e) => {
            if (document.activeElement === inputEl) return;

            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key) && !activeKeys.has(key)) {
                activeKeys.add(key);
                updateMovement();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) {
                activeKeys.delete(key);
                updateMovement();
            }
        });

        // Periodically refresh player list
        setInterval(() => wsSend({ type: 'tab' }), 10000);

        // Initialize
        (async () => {
            await loadBlocklist();
            connectWebSocket();
        })();
    </script>
</body>
</html>
